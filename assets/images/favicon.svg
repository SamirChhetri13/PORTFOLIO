<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Samir Chhetri" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- SC monogram -->
  <text
    x="32" y="44"
    text-anchor="middle"
    font-family="Helvetica Neue, Arial, sans-serif"
    font-weight="800"
    font-size="30"
    letter-spacing="-1.5"
    fill="#FFFFFF"
  >SC</text>

  <!-- accent: closing code-bracket dot, nods to "developer" without being literal -->
  <circle cx="47.5" cy="18.5" r="3.2" fill="#F472B6"/>
</svg>